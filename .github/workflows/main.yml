name: CI/CD Pipeline - Dental Segmentation Viewer

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsm6 libxext6

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Application Syntax & Model File Presence
        run: |
          python -c "import app; print('App syntax check passed!')"
          test -f models/anatomy_model.pt && echo "Anatomy model exists."
          test -f models/dental_model.pt && echo "Dental model exists."

  # Optional: Automatic deployment trigger step (e.g., Render / Railway / Docker)
  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy Notification
        run: |
          echo "Build and test completed successfully. Ready for cloud deployment!"
